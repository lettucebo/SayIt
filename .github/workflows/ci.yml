name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4 跑在 Node 20 上，GitHub 已宣告棄用並強制改跑 Node 24，每次執行都出警告。
      # v5 起原生就是 node24。
      - uses: actions/checkout@v7

      # setup-node 自 v5 起會自動偵測套件管理器並啟用快取。本 job 的 pnpm 是在
      # 下一步才安裝的，若它在此時就去呼叫 pnpm 會失敗。v6 起自動快取只在
      # 「從 package.json 判定為 npm」時啟用，而本 repo 的 packageManager 是
      # pnpm，因此不會觸發。
      #
      # ⚠️ 若日後要加 setup-node 的 pnpm 快取（`cache: pnpm`），必須先把
      # pnpm/action-setup 移到本步驟之前——明確指定 cache 會繞過上述 npm-only
      # 判斷，在 pnpm 尚未安裝時就執行快取還原。
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint src

      - name: Feedback presentation guard
        run: |
          if rg --glob '*.vue' 'feedback-fade|\.message\.value|\.type\.value' src/views src/MainApp.vue; then
            echo "Use InlineFeedback instead of hand-written view feedback rendering."
            exit 1
          fi

      - name: Test
        run: pnpm test

      # 型別檢查已由上方 Type check 步驟涵蓋，這裡只跑 vite build，
      # 以攔截 manualChunks / 動態 import / lazy JSON chunk 等只有打包才會現形的回歸。
      - name: Vite build
        run: npx vite build

  rust-check:
    strategy:
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --workspace
