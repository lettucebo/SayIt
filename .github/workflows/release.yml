name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # 先建立唯一的 draft release，再讓三個平台的 build job 上傳到它。
  #
  # 先前三個 build job 各自呼叫 tauri-action 且都帶 releaseDraft: true、
  # 沒有指定 releaseId；tauri-action 的行為是「找同 tag 的 draft，找不到就建一個」，
  # 三個 job 幾乎同時啟動時都看不到彼此，於是**建出多個同 tag 的 release**。
  # 資產與 latest.json 因此被拆散到不同 release，publish-release 只發佈其中一個，
  # 另一個連同 ARM 的 updater 檔案永遠留在 draft ——
  # Apple Silicon 使用者收不到自動更新（v0.15.2 實際發生過）。
  create-release:
    runs-on: ubuntu-24.04-arm
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          RAW_TAG="${RAW_TAG#refs/tags/}"
          RELEASE_VERSION="${RAW_TAG#v}"

          echo "RELEASE_TAG=$RAW_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

          NOTES=$(awk -v ver="$RELEASE_VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See the assets to download and install this version."
          fi
          printf '%s\n' "$NOTES" > release-notes.md

      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # 用列表過濾而非 /releases/tags/{tag}：後者查不到 draft release。
          find_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "[.[] | select(.tag_name==\"$RELEASE_TAG\")] | .[0].id // empty"
          }

          # Draft release 建立後，release list API 可能短暫尚未回傳新項目。
          # 有限重試後仍取不到才失敗，避免把空的 release ID 傳給平行 build job。
          wait_for_id() {
            local attempt
            local id
            for attempt in {1..10}; do
              id="$(find_id)"
              if [ -n "$id" ]; then
                printf '%s\n' "$id"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          ID="$(find_id)"
          if [ -n "$ID" ]; then
            echo "Reusing existing release $ID for $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SayIt v$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --draft \
              --verify-tag
            if ! ID="$(wait_for_id)"; then
              ID=""
            fi
          fi

          if [ -z "$ID" ]; then
            echo "Failed to resolve release id for $RELEASE_TAG" >&2
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            stable_name: SayIt-mac-arm64.dmg
            dmg_glob: "*.dmg"
            upload_sourcemaps: "true"
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            stable_name: SayIt-mac-x64.dmg
            dmg_glob: "*.dmg"
            upload_sourcemaps: "false"
          - platform: windows-latest
            args: --config src-tauri/tauri.release.windows.conf.json
            rust_target: ""
            stable_name: SayIt-windows-x64.exe
            dmg_glob: ""
            upload_sourcemaps: "false"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release metadata
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ inputs.tag }}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          RAW_TAG="${RAW_TAG#refs/tags/}"
          RELEASE_VERSION="${RAW_TAG#v}"

          echo "RELEASE_TAG=$RAW_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "SENTRY_RELEASE=sayit@$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=sayit@$RELEASE_VERSION" >> "$GITHUB_ENV"
          # Release body 由 create-release job 從 CHANGELOG 產生，這裡不重複。

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Artifact Signing CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          $toolVersion = "0.11.0"
          $expectedHash = "ddc6f6ef68631bf367ad051d7d37109e58d46095406e1fbba60d553b10f94393"
          $toolDirectory = Join-Path $env:RUNNER_TEMP "artifact-signing-cli"
          $toolPath = Join-Path $toolDirectory "artifact-signing-cli.exe"

          foreach ($requiredVariable in @(
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "AZURE_TENANT_ID",
            "AZURE_ARTIFACT_SIGNING_ACCOUNT",
            "AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($requiredVariable))) {
              throw "$requiredVariable must be configured before a Windows release can be signed"
            }
          }

          New-Item -ItemType Directory -Force -Path $toolDirectory | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/Levminer/artifact-signing-cli/releases/download/$toolVersion/artifact-signing-cli.exe" `
            -OutFile $toolPath

          $actualHash = (Get-FileHash -Path $toolPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "artifact-signing-cli checksum mismatch: expected $expectedHash, got $actualHash"
          }

          $azureCli = Get-Command az -CommandType Application |
            Where-Object { $_.Source -like "*.cmd" } |
            Select-Object -First 1
          if (-not $azureCli) {
            throw "Azure CLI az.cmd was not found"
          }
          if (-not (Test-Path -LiteralPath $azureCli.Source)) {
            throw "Azure CLI executable was not found: $($azureCli.Source)"
          }

          $minimumSdkVersion = [version]"10.0.26100.0"
          $signtool = Get-ChildItem `
            -Path "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse `
            -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
            ForEach-Object {
              try {
                $sdkVersion = [version]$_.Directory.Parent.Name
                if ($sdkVersion -ge $minimumSdkVersion) {
                  [PSCustomObject]@{ Path = $_.FullName; Version = $sdkVersion }
                }
              } catch {
                Write-Verbose "Skipping signtool with unparseable SDK version: $($_.FullName)"
              }
            } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe version $minimumSdkVersion or later was not found"
          }

          $toolDirectory | Add-Content -Path $env:GITHUB_PATH -Encoding utf8NoBOM
          "SIGNTOOL_PATH=$($signtool.Path)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM
          "AZURE_CLI_PATH=$($azureCli.Source)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8NoBOM

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: production
          VITE_SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ env.SENTRY_RELEASE }}
          VITE_SENTRY_RELEASE: ${{ env.VITE_SENTRY_RELEASE }}
          VITE_SENTRY_SOURCEMAPS_ENABLED: ${{ matrix.upload_sourcemaps }}
          AZURE_CLIENT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ runner.os == 'Windows' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_TENANT_ID: ${{ runner.os == 'Windows' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ACCOUNT || '' }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE || '' }}
        with:
          # 指定既有 release，三個平台才會上傳到同一個（也才會正確合併 latest.json）。
          # 不可改回 tagName + releaseDraft——那會讓每個 job 各自建 release。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Sentry release — sourcemaps, commits, deploy
        if: matrix.upload_sourcemaps == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        shell: bash
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_ORG}" ] || [ -z "${SENTRY_PROJECT}" ]; then
            echo "Sentry sourcemap upload skipped: missing Sentry release secrets."
            exit 0
          fi

          npx @sentry/cli releases new "$SENTRY_RELEASE" || true
          # Phase 5: associate commits to enable suspect-commits. Requires the repo
          # added in Sentry (Settings > Integrations > GitHub); non-fatal so the
          # release still succeeds if not yet configured.
          npx @sentry/cli releases set-commits "$SENTRY_RELEASE" --auto || true
          npx @sentry/cli sourcemaps upload dist/assets \
            --release "$SENTRY_RELEASE" \
            --url-prefix "~/assets" \
            --validate \
            --wait
          npx @sentry/cli releases finalize "$SENTRY_RELEASE" || true
          # Phase 8: mark a production deploy for this release (non-fatal).
          npx @sentry/cli releases deploys "$SENTRY_RELEASE" new -e production || true

      - name: Upload stable-name asset (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" | head -1)
          cp "$DMG" "${{ matrix.stable_name }}"
          gh release upload "$RELEASE_TAG" "${{ matrix.stable_name }}" --clobber
          shasum -a 256 "${{ matrix.stable_name }}" > "${{ matrix.stable_name }}.sha256"
          gh release upload "$RELEASE_TAG" "${{ matrix.stable_name }}.sha256" --clobber

      - name: Upload stable-name asset (Windows)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "${{ matrix.stable_name }}"
          gh release upload "$env:RELEASE_TAG" "${{ matrix.stable_name }}" --clobber
          $hash = (Get-FileHash "${{ matrix.stable_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.stable_name }}" | Set-Content -NoNewline "${{ matrix.stable_name }}.sha256"
          gh release upload "$env:RELEASE_TAG" "${{ matrix.stable_name }}.sha256" --clobber

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ID="${{ needs.create-release.outputs.release_id }}"

          # updater manifest 必須涵蓋全部三個平台。缺 darwin-aarch64 時
          # Apple Silicon 使用者會靜默收不到更新，且不會有任何錯誤訊息。
          PLATFORMS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" \
            --jq '.[] | select(.name=="latest.json") | .id' \
            | xargs -I{} gh api "repos/$GITHUB_REPOSITORY/releases/assets/{}" \
                -H "Accept: application/octet-stream" \
            | jq -r '.platforms | keys[]')

          echo "latest.json platforms:"
          echo "$PLATFORMS"

          for want in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! echo "$PLATFORMS" | grep -qx "$want"; then
              echo "::error::latest.json is missing platform '$want'" >&2
              exit 1
            fi
          done

          # 官網固定下載連結所指向的檔案
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[].name')
          for want in SayIt-mac-arm64.dmg SayIt-mac-x64.dmg SayIt-windows-x64.exe; do
            if ! echo "$NAMES" | grep -qx "$want"; then
              echo "::error::release is missing asset '$want'" >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 資產驗證通過後才公開，避免殘缺的 draft release 被使用者取得。
          # 用 release id 而非 tag：tag 查詢在有多個同 tag release 時會挑錯對象。
          gh api -X PATCH \
            "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false
